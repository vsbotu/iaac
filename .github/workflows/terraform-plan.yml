
name: Terraform Plan (OIDC - Dev)

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "modules/**"
      - "environments/dev/**"
      - ".github/workflows/terraform-plan.yml"

  pull_request:
    branches:
      - main
    paths:
      - "modules/**"
      - "environments/dev/**"
      - ".github/workflows/terraform-plan.yml"

permissions:
  id-token: write   # REQUIRED for AWS OIDC
  contents: read

concurrency:
  group: terraform-dev
  cancel-in-progress: false

jobs:
  terraform-plan:
    name: Terraform Plan (Dev)
    runs-on: ubuntu-latest

    environment: dev   # GitHub Environment (vars)

    defaults:
      run:
        working-directory: environments/dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/Iacc_githhub_actions_role
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6
          terraform_wrapper: false

      # ✅ Added version check (ONLY change)
      - name: Verify Terraform version
        run: terraform version

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -input=false -var-file="terraform.tfvars"
